name: Hatta presentation review
on:
  push:
    branches: [codex/hatta-identity-review]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm install --no-save --no-package-lock sharp
      - run: npx playwright install chromium
      - run: node tests/brand-review.cjs
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: hatta-review
          path: |
            tests/.brand-output
            tests/.output
            preview-hatta.png
